spring.application.name=sistema-gestao

# Conexão Dinâmica com o Banco de Dados (Nuvem)
spring.datasource.url=${DB_URL:jdbc:postgresql://db.hvxlazraaonvvisbopow.supabase.co:6543/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Configurações do Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Porta do Servidor na Nuvem
server.port=${PORT:8080}